# Studio stack. Phase 2 wires the backend only; the web app (issue #57) joins next.
#
# The database is a Supabase project (Cloud by default). Copy `.env.example` to
# `.env` and fill in SUPABASE_URL and SUPABASE_ANON_KEY from the dashboard, then:
#
#   docker compose up --build

services:
  server:
    build:
      context: .
      dockerfile: ui/server/Dockerfile
    ports:
      - "8787:8787"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      SUPABASE_URL: ${SUPABASE_URL:?set it in .env}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set it in .env}
      STUDIO_SITE_URL: ${STUDIO_SITE_URL:-http://127.0.0.1:5173}
