# Studio stack: the web app and the backend. The database is a Supabase project
# (Cloud by default). Copy `.env.example` to `.env` and fill in the keys from the
# dashboard, then:
#
#   docker compose up --build
#
# The web image bakes VITE_* at build time, so a change to those needs a rebuild.

services:
  web:
    build:
      context: .
      dockerfile: packages/studio-web/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?set it in .env}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?set it in .env}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8787}
    ports:
      - "5173:80"
    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: packages/studio-server/Dockerfile
    ports:
      - "8787:8787"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      SUPABASE_URL: ${SUPABASE_URL:?set it in .env}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set it in .env}
      STUDIO_SITE_URL: ${STUDIO_SITE_URL:-http://localhost:5173,http://127.0.0.1:5173}
