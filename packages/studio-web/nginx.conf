server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: every unknown path serves the app shell so the client router can handle it.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
