name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm depcruise
      - run: pnpm i18n:check
      - run: pnpm build

  db:
    # Studio schema (supabase/). Applies the migrations to a bare Postgres with a
    # thin Supabase shim, then runs the RLS smoke test. Does not need the full
    # Supabase stack. Runs in parallel with `check`.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply shim + migrations + RLS smoke test
        env:
          PSQL: psql "$PGURL" -v ON_ERROR_STOP=1
        run: bash scripts/db-smoke.sh

  ui:
    # Satellite viewer (ui/). A pnpm workspace package with its own Vite/Vitest
    # toolchain — runs in parallel with `check` and never blocks the core job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -C ui run typecheck
      - run: pnpm -C ui test
      - run: pnpm -C ui run build
