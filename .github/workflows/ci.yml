name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm depcruise
      - run: pnpm i18n:check
      - run: pnpm build
      # after build: the generator imports from dist/ (checks the committed
      # the seed_templates migration matches presets + fixtures)
      - run: pnpm templates:check

  db:
    # Studio schema (packages/studio-db/). Applies the migrations to a bare Postgres with a
    # thin Supabase shim, then runs the RLS smoke test. Does not need the full
    # Supabase stack. Runs in parallel with `check`.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply shim + migrations + RLS smoke test
        env:
          PSQL: psql "$PGURL" -v ON_ERROR_STOP=1
        run: bash packages/studio-db/scripts/db-smoke.sh

  ui:
    # Satellite viewer (packages/viewer/). A pnpm workspace package with its own Vite/Vitest
    # toolchain — runs in parallel with `check` and never blocks the core job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -C packages/viewer run typecheck
      - run: pnpm -C packages/viewer test
      - run: pnpm -C packages/viewer run build

  studio-server:
    # Studio backend (packages/studio-server/). Imports the core through `laivel-up/compose`,
    # so the core is built first. Parallel with `check`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm -C packages/studio-server run typecheck
      - run: pnpm -C packages/studio-server test
      - run: pnpm -C packages/studio-server run build

  studio-web:
    # Studio web app (packages/studio-web/). React SPA; VITE_* are stubbed for typecheck/test
    # and given placeholder values for the build. Parallel with `check`.
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_ANON_KEY: ci-placeholder
      VITE_API_URL: http://localhost:8787
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # preset.test.ts imports laivel-up/compose to check builder output parses
      - run: pnpm build
      - run: pnpm -C packages/studio-web run typecheck
      - run: pnpm -C packages/studio-web test
      - run: pnpm -C packages/studio-web run build
