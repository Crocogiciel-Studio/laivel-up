name: Queue runner

# Autopilot queue. Every hour, if no run is mid-flight, promote the oldest `queued` issue to
# `to-implement` — which the aidd-async pipeline picks up and turns into a draft PR. One run at a
# time (the `claude/working` guard), but it does NOT wait for the previous PR to be merged: the
# batch builds a stack of draft PRs for a human to review.
#
# Start:  gh workflow run queue-runner.yml            (one tick now)
# Pause:  gh variable set QUEUE_PAUSED --body true     (cron stays scheduled, promote is a no-op)
# Resume: gh variable set QUEUE_PAUSED --body false
# Off:    gh workflow disable queue-runner.yml         (cron AND manual dispatch off)
#
# Nothing here merges anything.

on:
  schedule:
    - cron: "7 * * * *" # 7 past the hour: the :00 slot is the most contended and most delayed
  workflow_dispatch:

permissions: {}

concurrency:
  group: queue-runner
  cancel-in-progress: false

jobs:
  promote:
    name: Promote the next queued issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.AIDD_BOT_TOKEN }}
          script: |
            if (String(process.env.QUEUE_PAUSED).toLowerCase() === "true") {
              core.notice("QUEUE_PAUSED is set — promoting nothing");
              return;
            }

            const { owner, repo } = context.repo;
            const STALE_HOURS = 3; // a to-implement issue with no PR after this long is not in flight
            const DONE_LABELS = ["claude/awaiting-review", "claude/blocked"];

            const issuesWith = (labels) =>
              github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: "open", labels, sort: "created", direction: "asc", per_page: 100,
              }).then((rows) => rows.filter((i) => !i.pull_request));
            const swallow404 = (e) => { if (e.status !== 404) throw e; };
            const labelNames = (i) => i.labels.map((l) => l.name ?? l);

            // Closing-PR reference. This convention is also matched in
            // .github/workflows/aidd-async.yml (its dispatch and finalize steps) — keep the three
            // in sync, or factor them into a shared script.
            const CLOSES = (n) => new RegExp(`\\b(Closes|Fixes|Resolves)\\s+#${n}\\b`, "i");
            const allPRs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "all", per_page: 100,
            });
            const hasClosingPR = (n) => allPRs.some((p) => CLOSES(n).test(p.body || ""));

            // 1. A run is actively working — one at a time.
            const working = await issuesWith("claude/working");
            if (working.length) {
              core.info(`in flight: #${working[0].number} — nothing to promote`);
              return;
            }

            // 2. A dispatched issue whose run has not finished yet (no done label, no PR) and is
            //    still fresh — wait for it. Anything else (finished, has a PR, or gone stale) gets
            //    its now-spent to-implement label stripped so the queue reads cleanly.
            for (const i of await issuesWith("to-implement")) {
              const finished = labelNames(i).some((n) => DONE_LABELS.includes(n)) || hasClosingPR(i.number);
              if (!finished) {
                const ageHours = (Date.now() - Date.parse(i.updated_at)) / 3.6e6;
                if (ageHours < STALE_HOURS) {
                  core.info(`#${i.number} dispatched, run not finished (${ageHours.toFixed(1)}h) — waiting`);
                  return;
                }
                core.warning(`#${i.number} stuck as to-implement for ${ageHours.toFixed(1)}h — clearing`);
              }
              await github.rest.issues
                .removeLabel({ owner, repo, issue_number: i.number, name: "to-implement" })
                .catch(swallow404);
            }

            // 3. Promote the oldest queued issue. Add the new label before removing the old one, so
            //    a failed call never leaves the issue in neither list.
            const queued = await issuesWith("queued");
            if (!queued.length) {
              core.info("queue empty — nothing to do");
              return;
            }
            const next = queued[0];
            await github.rest.issues.addLabels({
              owner, repo, issue_number: next.number, labels: ["to-implement"],
            });
            await github.rest.issues
              .removeLabel({ owner, repo, issue_number: next.number, name: "queued" })
              .catch(swallow404);
            core.notice(`promoted #${next.number}: ${next.title}`);
        env:
          QUEUE_PAUSED: ${{ vars.QUEUE_PAUSED }}
